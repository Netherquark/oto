[pytest]
# The repo's pytest configuration: where the tests live, which markers exist,
# and how a distributed run is spelled.
#
# The suite is CPU-only (no GPU, no Tensile run) and every test writes into a
# tmp dir, so `pytest -n auto` is safe: see tests/conftest.py for the `serial`
# marker that keeps a future shared-state test out of a distributed run.
#
#   pytest                     # the whole suite, serial
#   pytest -n auto             # the whole suite, distributed (xdist)
#   pytest -m preflight        # the fast pre-run subset the checklist runs
#   OTO_GUARD_FILES=1 pytest tests/test_function_length.py tests/test_pyflakes.py tests/test_ruff.py tests/test_py_compile.py tests/test_file_length.py   # changed files only
testpaths = tests
markers =
    serial: writes into the repo tree; skipped under a distributed run
    preflight: the fast pre-run subset the overnight checklist runs
filterwarnings =
    error::DeprecationWarning
